name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python3 -m pip install -e ".[dev]"
      - name: Run tests
        run: python3 -m pytest -v --cov=numpy_poisson_variance_guard --cov-report=term-missing
      - name: Smoke-test installed console script
        run: |
          numpy-poisson-variance-guard --version
          numpy-poisson-variance-guard diagnose --lam 1e10 --samples 20000 --json | python3 -m json.tool > /dev/null || true
          numpy-poisson-variance-guard sample --lam 1e16 --size 500 --seed 1 --json | python3 -m json.tool > /dev/null

  build-artifact:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python3 -m pip install build
          python3 -m build
      - name: Smoke-test the built wheel on this Linux runner
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/numpy-poisson-variance-guard --version
          # diagnose exits 1 when numpy's own sampler is confirmed affected,
          # which is the expected/likely finding on a fresh numpy install as
          # of this writing -- only fail the smoke test on an unexpected
          # exit code (anything other than 0=not-affected or 1=affected).
          set +e
          /tmp/smoke-venv/bin/numpy-poisson-variance-guard diagnose --lam 1e16 --samples 50000 --json > /tmp/smoke-out.json
          code=$?
          set -e
          echo "diagnose exit=$code"
          test "$code" -eq 0 -o "$code" -eq 1
          python3 -m json.tool /tmp/smoke-out.json
          # sample (the safe_poisson workaround itself) must always run
          # cleanly and produce the requested number of samples.
          /tmp/smoke-venv/bin/numpy-poisson-variance-guard sample --lam 1e16 --size 1000 --seed 42 --json | python3 -m json.tool > /dev/null
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
